name: Android CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Cancel an older run for the same branch when a newer commit arrives.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      # setup-gradle provides dependency and build cache between workflow runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify official Gradle Wrapper JAR SHA-256
        shell: bash
        run: |
          expected='ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            printf 'Gradle Wrapper JAR SHA-256 mismatch: expected %s, got %s\\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon --stacktrace :core-detect:test :core-fusion:test :core-cell:test testDebugUnitTest assembleDebug

      - name: Upload unit test reports on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            core-cell/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ClearGPS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
