name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows bootstrap PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in (Get-ChildItem windows-build -Filter '*.ps1' -File)) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { '{0}: {1}' -f $_.Extent.StartLineNumber, $_.Message }) -join [Environment]::NewLine
              throw ('PowerShell syntax error(s) in ' + $file.Name + ':' + [Environment]::NewLine + $details)
            }
          }
          Write-Host 'PowerShell syntax check passed.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify official Gradle Wrapper JAR SHA-256
        shell: bash
        run: |
          # Reference: https://gradle.org/release-checksums/
          expected='ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            printf 'Gradle Wrapper JAR SHA-256 mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          echo 'Gradle Wrapper JAR SHA-256 verified.'
      - name: Run tests and build debug APK with the checked-in Gradle Wrapper
        run: ./gradlew --no-daemon --stacktrace :core-detect:test :core-fusion:test testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ClearGPS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Smoke-test Gradle argument forwarding with spaced JVM settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLEARGPS_GRADLE_JVM_ARGS = '-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8'
          & .\gradlew.bat --version
          if ($LASTEXITCODE -ne 0) { throw "Gradle argument-forwarding smoke test failed with exit code $LASTEXITCODE." }
          Remove-Item Env:CLEARGPS_GRADLE_JVM_ARGS -ErrorAction SilentlyContinue
      - name: Run unit tests and build debug APK on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat --no-daemon --stacktrace :core-detect:test :core-fusion:test testDebugUnitTest assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "Windows tests/build failed with exit code $LASTEXITCODE." }
