name: Android build and unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build APK and run unit tests
        shell: pwsh
        run: .\windows-build\build-apk.ps1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClearGPS-debug
          path: dist/ClearGPS-debug.apk
          if-no-files-found: error
          retention-days: 14
